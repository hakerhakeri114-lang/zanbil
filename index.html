  <!-- Toast -->

  <script>
    // ===================== تنظیمات Firebase =====================
    // !!! این قسمت را با اطلاعات پروژه خودت عوض کن !!!
    // آموزش ساخت پروژه رایگان در انتهای فایل آمده
    const firebaseConfig = {
      apiKey: "AIzaSyDVPavI_--P3MZx2DECCDXwt9QGoywSNUU",
      authDomain: "zanbil-family.firebaseapp.com",
      projectId: "zanbil-family",
      storageBucket: "zanbil-family.firebasestorage.app",
      messagingSenderId: "517710636080",
      appId: "1:517710636080:web:069a5b8ab4773c09a039f5"
    };

    // اگر هنوز کانفیگ نزدی، از حالت دمو (لوکال) استفاده می‌شود
    let USE_DEMO = false;
    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
      USE_DEMO = true;
      console.warn("حالت دمو فعال است. برای استفاده واقعی کانفیگ Firebase را وارد کنید.");
    }

    let app, db, auth;
    if (!USE_DEMO) {
      app = firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();
    }

    // ===================== متغیرهای سراسری =====================
    let currentUser = null;          // {id, name, phone}
    let allUsers = [];
    let myLists = [];
    let receivedLists = [];
    let currentPage = 'home';
    let editingListId = null;
    let currentChatId = null;        // برای چت فعال
    let chatMessages = [];
    let chatPollInterval = null;

    // دسته‌بندی‌ها
    const CATEGORIES = [
      { id: 'dairy', name: 'لبنیات', icon: '🥛' },
      { id: 'meat', name: 'گوشت و مرغ', icon: '🥩' },
      { id: 'fruit', name: 'میوه و سبزی', icon: '🍎' },
      { id: 'bakery', name: 'نان و غلات', icon: '🍞' },
      { id: 'dry', name: 'خشکبار و حبوبات', icon: '🥜' },
      { id: 'clean', name: 'شوینده و بهداشتی', icon: '🧴' },
      { id: 'other', name: 'سایر', icon: '🛒' }
    ];

    // ===================== حالت دمو (لوکال استوریج) =====================
    const DEMO_KEY = 'zanbil_demo_data';
    function getDemoData() {
      const raw = localStorage.getItem(DEMO_KEY);
      if (!raw) {
        const init = { users: [], lists: [], messages: {} };
        localStorage.setItem(DEMO_KEY, JSON.stringify(init));
        return init;
      }
      const data = JSON.parse(raw);
      if (!data.messages) data.messages = {};
      return data;
    }
    function saveDemoData(data) {
      localStorage.setItem(DEMO_KEY, JSON.stringify(data));
    }

    // ===================== توابع کمکی =====================
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.className = `toast px-5 py-3 rounded-xl text-white text-sm font-medium shadow-lg fade-in ${type === 'success' ? 'bg-teal-600' : 'bg-red-500'}`;
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2800);
    }

    function formatDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('fa-IR') + ' - ' + d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    }

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function sendLocalNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body, icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🛒</text></svg>' });
      }
    }

    // ===================== ورود =====================
    async function doLogin() {
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      
      function showLoginError(msg) {
        if (errEl) {
          errEl.textContent = msg;
          errEl.classList.remove('hidden');
        }
        showToast(msg, 'error');
      }

      try {
        if (errEl) errEl.classList.add('hidden');
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'در حال ورود...';
        }

        const name = document.getElementById('login-name').value.trim();
        let phone = document.getElementById('login-phone').value.trim().replace(/[\s\-\(\)\.]/g, '');

        // تبدیل اعداد فارسی به انگلیسی
        phone = phone.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

        if (!name || name.length < 2) {
          showLoginError('نام را درست وارد کنید');
          return;
        }

        if (phone.startsWith('+98')) phone = '0' + phone.slice(3);
        if (phone.startsWith('98') && phone.length >= 12) phone = '0' + phone.slice(2);
        if (phone.startsWith('9') && phone.length === 10) phone = '0' + phone;

        if (!/^09\d{9}$/.test(phone)) {
          showLoginError('شماره را به صورت ۱۱ رقمی وارد کنید (مثال: 09123456789)');
          return;
        }

        if (USE_DEMO) {
          const data = getDemoData();
          let user = data.users.find(u => u.phone === phone);
          if (!user) {
            user = { id: 'u_' + Date.now(), name, phone, createdAt: Date.now() };
            data.users.push(user);
            saveDemoData(data);
          } else {
            user.name = name;
            saveDemoData(data);
          }
          currentUser = user;
        } else {
          if (typeof firebase === 'undefined' || !db) {
            showLoginError('اتصال به سرور برقرار نشد. اینترنت را چک کنید و صفحه را رفرش کنید');
            return;
          }
          const usersRef = db.collection('users');
          const snap = await usersRef.where('phone', '==', phone).limit(1).get();
          if (snap.empty) {
            const docRef = await usersRef.add({ 
              name, 
              phone, 
              createdAt: firebase.firestore.FieldValue.serverTimestamp() 
            });
            currentUser = { id: docRef.id, name, phone };
          } else {
            const doc = snap.docs[0];
            currentUser = { id: doc.id, name: name, phone };
            await usersRef.doc(doc.id).update({ name });
          }
        }

        localStorage.setItem('zanbil_user', JSON.stringify(currentUser));
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('header-user').textContent = currentUser.name + ' · ' + currentUser.phone;
        requestNotificationPermission();
        await loadAllData();
        showPage('home');
        showToast('خوش آمدید ' + currentUser.name + '!');
      } catch (err) {
        console.error('Login error:', err);
        const msg = (err && err.message) ? err.message : 'مشکل در ارتباط با سرور';
        showLoginError('خطا: ' + msg);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'ورود به زنبیل';
        }
      }
    }

    function logout() {
      localStorage.removeItem('zanbil_user');
      currentUser = null;
      document.getElementById('app').classList.add('hidden');
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('login-name').value = '';
      document.getElementById('login-phone').value = '';
    }

    // ===================== بارگذاری داده‌ها =====================
    async function loadAllData() {
      await Promise.all([loadUsers(), loadMyLists(), loadReceivedLists()]);
      updateBadge();
    }

    async function loadUsers() {
      if (USE_DEMO) {
        allUsers = getDemoData().users.filter(u => u.id !== currentUser.id);
      } else {
        const snap = await db.collection('users').get();
        allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.id !== currentUser.id);
      }
    }

    async function loadMyLists() {
      if (USE_DEMO) {
        myLists = getDemoData().lists.filter(l => l.creatorId === currentUser.id).sort((a,b) => b.createdAt - a.createdAt);
      } else {
        const snap = await db.collection('lists')
          .where('creatorId', '==', currentUser.id)
          .orderBy('createdAt', 'desc')
          .get();
        myLists = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }
    }

    async function loadReceivedLists() {
      if (USE_DEMO) {
        receivedLists = getDemoData().lists.filter(l => l.assigneeId === currentUser.id).sort((a,b) => b.createdAt - a.createdAt);
      } else {
        const snap = await db.collection('lists')
          .where('assigneeId', '==', currentUser.id)
          .orderBy('createdAt', 'desc')
          .get();
        receivedLists = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      }
    }

    function updateBadge() {
      const pending = receivedLists.filter(l => l.status !== 'done').length;
      const badge = document.getElementById('badge-received');
      if (pending > 0) {
        badge.textContent = pending;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // ===================== ناوبری =====================
    function showPage(page) {
      // توقف پولینگ چت وقتی از چت خارج می‌شویم
      if (page !== 'chatroom' && chatPollInterval) {
        clearInterval(chatPollInterval);
        chatPollInterval = null;
        currentChatId = null;
      }

      currentPage = page;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('text-teal-700');
        b.classList.add('text-slate-400');
      });
      const active = document.getElementById('nav-' + page);
      if (active) {
        active.classList.remove('text-slate-400');
        active.classList.add('text-teal-700');
      }

      const main = document.getElementById('main-content');
      if (page === 'home') renderHome(main);
      else if (page === 'create') renderCreate(main);
      else if (page === 'received') renderReceived(main);
      else if (page === 'chat') renderChatList(main);
      else if (page === 'users') renderUsers(main);
      else if (page === 'detail' || page === 'chatroom') {} // handled separately
    }

    // ===================== صفحه خانه (لیست‌های من) =====================
    function renderHome(container) {
      let html = `
        <div class="mb-4">
          <h2 class="text-lg font-bold text-slate-800">لیست‌های من</h2>
          <p class="text-sm text-slate-500">لیست‌هایی که خودت ساختی</p>
        </div>
      `;

      if (myLists.length === 0) {
        html += `
          <div class="card p-8 text-center">
            <div class="text-4xl mb-3">📝</div>
            <p class="text-slate-500">هنوز لیستی نساختی</p>

    async function loadChatMessages(chatId) {
      if (USE_DEMO) {
        const data = getDemoData();
        if (!data.messages) data.messages = {};
        chatMessages = (data.messages[chatId] || []).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      } else {
        try {
          // بدون orderBy تا نیاز به Index نباشد
          const snap = await db.collection('messages')
            .where('chatId', '==', chatId)
            .limit(150)
            .get();
          chatMessages = snap.docs.map(d => {
            const data = d.data();
            // تبدیل Timestamp به عدد
            let ts = data.createdAt;
            if (ts && typeof ts.toMillis === 'function') ts = ts.toMillis();
            else if (ts && ts.seconds) ts = ts.seconds * 1000;
            return { id: d.id, ...data, createdAt: ts || 0 };
          });
          // مرتب‌سازی سمت کلاینت
          chatMessages.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        } catch (err) {
          console.error('Load messages error:', err);
          chatMessages = [];
        }
      }
      return chatMessages;
    }

    async function sendMessage(chatId, text) {
      if (!text.trim()) return;
      const msg = {
        chatId,
        senderId: currentUser.id,
        senderName: currentUser.name,
        text: text.trim(),
        createdAt: Date.now()
      };

      try {
        if (USE_DEMO) {
          const data = getDemoData();
          if (!data.messages) data.messages = {};
          if (!data.messages[chatId]) data.messages[chatId] = [];
          msg.id = 'm_' + Date.now();
          data.messages[chatId].push(msg);
          saveDemoData(data);
        } else {
          await db.collection('messages').add({
            chatId: msg.chatId,
            senderId: msg.senderId,
            senderName: msg.senderName,
            text: msg.text,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        // رفرش پیام‌ها
        await loadChatMessages(chatId);
        renderChatRoomMessages();
      } catch (err) {
        console.error('Send message error:', err);
        showToast('خطا در ارسال پیام: ' + (err.message || ''), 'error');
      }
    }

    async function saveList() {
      const title = document.getElementById('list-title').value.trim();
      const assigneeId = document.getElementById('list-assignee').value;
      const dateVal = document.getElementById('list-date').value.trim();
      const timeVal = document.getElementById('list-time').value;

      if (!title) return showToast('عنوان لیست را بنویس', 'error');
      if (!assigneeId) return showToast('یک نفر را برای ارسال انتخاب کن', 'error');

      const validItems = createItems.filter(i => i.name.trim());
      if (validItems.length === 0) return showToast('حداقل یک کالا اضافه کن', 'error');

      const assignee = allUsers.find(u => u.id === assigneeId);

      // تبدیل تاریخ شمسی به میلادی برای ذخیره
      let scheduledAt = null;
      if (dateVal) {
        try {
          // dateVal مثل 1405/06/11 است
          const parts = dateVal.split(/[\/\-\.]/);
          if (parts.length === 3) {
            const jy = parseInt(parts[0]);
            const jm = parseInt(parts[1]);
            const jd = parseInt(parts[2]);
            // استفاده از persian-date برای تبدیل
            const pd = new persianDate([jy, jm, jd]);
            let dateObj = pd.toDate(); // تبدیل به Date میلادی
            if (timeVal) {
              const [h, m] = timeVal.split(':');
              dateObj.setHours(parseInt(h) || 0, parseInt(m) || 0, 0, 0);
            }
            scheduledAt = dateObj.getTime();
          }
        } catch (e) {
          console.warn('خطا در تبدیل تاریخ شمسی', e);
        }
      }

      const listData = {
        title,
        creatorId: currentUser.id,
        creatorName: currentUser.name,
        assigneeId,
        assigneeName: assignee ? assignee.name : '',
        items: validItems.map(i => ({
          name: i.name.trim(),
          category: i.category,
          qty: i.qty || '1',
          unit: i.unit,
          done: false
        })),
        status: 'pending',
        createdAt: Date.now(),
        scheduledAt,
        completedBy: null,
        completedAt: null
      };

      try {
        if (USE_DEMO) {
          const data = getDemoData();
          listData.id = 'l_' + Date.now();
          data.lists.push(listData);
          saveDemoData(data);
        } else {
          await db.collection('lists').add({
            ...listData,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            scheduledAt: scheduledAt ? firebase.firestore.Timestamp.fromDate(new Date(scheduledAt)) : null
          });
        }

        showToast('لیست با موفقیت ارسال شد ✓');
        await loadAllData();
        showPage('home');

        // نوتیفیکیشن ساده
        sendLocalNotification('لیست جدید ارسال شد', `لیست «${title}» برای ${listData.assigneeName} فرستاده شد`);
      } catch (err) {
        console.error(err);
        showToast('خطا در ذخیره لیست', 'error');
      }
    }

    // ===================== جزئیات لیست =====================
    async function openListDetail(listId, from) {
      let list;
      if (USE_DEMO) {
        list = getDemoData().lists.find(l => l.id === listId);
      } else {
        const doc = await db.collection('lists').doc(listId).get();
        if (!doc.exists) return showToast('لیست پیدا نشد', 'error');
        list = { id: doc.id, ...doc.data() };
      }

      if (!list) return;

      currentPage = 'detail';
      const container = document.getElementById('main-content');
      const isAssignee = list.assigneeId === currentUser.id;
      const isCreator = list.creatorId === currentUser.id;
      const canEditItems = isAssignee && list.status !== 'done';

      // گروه‌بندی بر اساس دسته
      const grouped = {};
      CATEGORIES.forEach(c => grouped[c.id] = []);
      (list.items || []).forEach(item => {
        const cat = item.category || 'other';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      let itemsHtml = '';
      CATEGORIES.forEach(cat => {
        if (grouped[cat.id] && grouped[cat.id].length > 0) {
          itemsHtml += `<div class="mb-4"><p class="text-xs font-semibold text-slate-500 mb-2">${cat.icon} ${cat.name}</p>`;
          grouped[cat.id].forEach((item, idx) => {
            const globalIdx = list.items.findIndex(i => i === item);
            itemsHtml += `
              <div class="flex items-center gap-3 py-2.5 border-b border-slate-100 last:border-0 ${item.done ? 'item-done' : ''}">
                ${canEditItems ? `
                  <button onclick="toggleItemDone('${listId}', ${globalIdx})" class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${item.done ? 'bg-teal-500 border-teal-500 text-white' : 'border-slate-300'}">
                    ${item.done ? '✓' : ''}
                  </button>
                ` : `
                  <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${item.done ? 'bg-teal-500 border-teal-500 text-white' : 'border-slate-300'}">
                    ${item.done ? '✓' : ''}
                  </div>
                `}
                <div class="flex-1">
                  <p class="font-medium text-sm">${item.name}</p>
                  <p class="text-xs text-slate-500">${item.qty} ${item.unit}</p>
                </div>
              </div>
            `;
          });
          itemsHtml += `</div>`;
        }
      });

      container.innerHTML = `
        <button onclick="showPage('${from === 'my' ? 'home' : 'received'}')" class="text-teal-600 text-sm mb-3 flex items-center gap-1">
          ← بازگشت
        </button>

        <div class="card p-4 mb-4">
          <h2 class="text-xl font-bold text-slate-800">${list.title}</h2>
          <div class="mt-2 space-y-1 text-sm text-slate-600">
            <p>از طرف: <span class="font-medium">${list.creatorName}</span></p>
            <p>برای: <span class="font-medium">${list.assigneeName}</span></p>
            <p>زمان: ${formatDate(list.scheduledAt || list.createdAt)}</p>
            <p>وضعیت: <span class="font-medium">${list.status === 'done' ? 'انجام شد' : list.status === 'in_progress' ? 'در حال خرید' : 'در انتظار'}</span></p>
            ${list.completedBy ? `<p class="text-green-600">✓ خرید توسط ${list.completedBy} در ${formatDate(list.completedAt)}</p>` : ''}
          </div>
        </div>

        <div class="card p-4">
          <h3 class="font-semibold mb-3">اقلام خرید</h3>
          ${itemsHtml || '<p class="text-slate-400 text-sm">کالایی نیست</p>'}
        </div>

        ${isAssignee && list.status !== 'done' ? `
          <button onclick="markListDone('${listId}')" class="btn-primary w-full text-white font-semibold py-3.5 rounded-xl mt-5 shadow-md">
            ✓ خرید کامل شد
          </button>
        ` : ''}
      `;
    }

    async function toggleItemDone(listId, itemIndex) {
      try {
        if (USE_DEMO) {
          const data = getDemoData();
          const list = data.lists.find(l => l.id === listId);
          if (list && list.items[itemIndex]) {
            list.items[itemIndex].done = !list.items[itemIndex].done;
            // اگر حداقل یکی تیک خورده باشد وضعیت را in_progress کن
            if (list.items.some(i => i.done) && list.status === 'pending') list.status = 'in_progress';
            saveDemoData(data);
          }
        } else {
          const ref = db.collection('lists').doc(listId);
          const doc = await ref.get();
          const list = doc.data();
          list.items[itemIndex].done = !list.items[itemIndex].done;
          if (list.items.some(i => i.done) && list.status === 'pending') list.status = 'in_progress';
          await ref.update({ items: list.items, status: list.status });
        }
        openListDetail(listId, currentPage === 'detail' ? 'received' : 'received');
        await loadReceivedLists();
        updateBadge();
      } catch (err) {
        console.error(err);
        showToast('خطا', 'error');
      }
    }

    async function markListDone(listId) {
      if (!confirm('آیا خرید کامل انجام شده؟')) return;

      try {
        if (USE_DEMO) {
          const data = getDemoData();
          const list = data.lists.find(l => l.id === listId);
          if (list) {
            list.status = 'done';
            list.completedBy = currentUser.name;
            list.completedAt = Date.now();
            list.items.forEach(i => i.done = true);
            saveDemoData(data);
          }
        } else {
          await db.collection('lists').doc(listId).update({
            status: 'done',
            completedBy: currentUser.name,
            completedAt: firebase.firestore.FieldValue.serverTimestamp(),
            items: firebase.firestore.FieldValue.arrayUnion() // will handle properly below
          });
          // بهتر است کل items را آپدیت کنیم
          const doc = await db.collection('lists').doc(listId).get();
          const items = doc.data().items.map(i => ({ ...i, done: true }));
          await db.collection('lists').doc(listId).update({ items });
        }

        showToast('عالی! خرید ثبت شد و به فرستنده اطلاع داده شد');
        sendLocalNotification('خرید انجام شد', `${currentUser.name} خرید را تکمیل کرد`);

        await loadAllData();
        showPage('received');
      } catch (err) {
        console.error(err);
        showToast('خطا در ثبت', 'error');
      }
    }

    // ===================== راه‌اندازی =====================
    window.onload = function() {
      const saved = localStorage.getItem('zanbil_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        document.getElementById('login-page').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('header-user').textContent = currentUser.name + ' · ' + currentUser.phone;
        loadAllData().then(() => showPage('home'));
        requestNotificationPermission();
      }
    };
  </script>
